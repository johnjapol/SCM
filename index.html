// s: section, p: page, t: text with [[answer]], n: note, set: 1차 연습(10문제) or 추가(56문제)
const Q = [
  // 15–18
  {gone:1,s:0,set:"1차",p:"15–18쪽",t:"공급사슬의 참여자는 생산업체, 유통업자, [[소매상]], 고객, [[서비스 제공자]]의 5가지이다.",n:"고객이 기업이면 '고객 업체'가 되고, 일반 소비자도 인플루언서 등으로 SCM에 참여한다."},
  {s:0,set:"1차",p:"18쪽",t:"저관여 상품은 주로 생필품으로 습관적·충동적 구매를 하며 [[동반 구매]] 욕구를 가지고, 고관여 상품은 전문품으로 [[계획]] 구매를 하며 [[동시 비교]] 욕구를 가진다.",n:"저관여: 과자 사러 갔다가 옆 디저트도 같이 산다. 고관여: 핸드폰·자동차는 여러 개를 놓고 비교한다."},
  {s:0,p:"16쪽",t:"생산자는 원재료를 [[부품]]과 반제품으로 변형시키거나, 이를 다시 [[완제품]]과 소비재로 변형시킨다.",n:"동부하이텍처럼 부품을 만드는 곳, 삼성전자처럼 완제품을 만드는 곳 모두 생산자."},
  {s:0,p:"16쪽",t:"생산자에는 무형 제품을 만드는 곳도 있는데, 미용실·병원·대학 같은 곳은 [[서비스]] 업체라고 할 수 있다.",n:"무형 제품 생산자."},
  {s:0,p:"17쪽",t:"유통업자(도매상)는 생산자로부터 재고를 사서 [[시간]]과 [[장소]]의 기능을 수행한다.",n:"생선·배추 도매상처럼 대량으로 사서 신선하게 보관했다가 소매상에 공급."},
  {s:0,p:"15–16쪽",t:"공급사슬 참여자 중 고객이 일반 소비자가 아니라 기업인 경우 이를 [[고객 업체]](이)라고 한다.",n:"예: 동부하이텍의 고객은 삼성전자·SK하이닉스."},
  {s:0,p:"16쪽",t:"학교에서는 '공급업체'라는 말을 많이 쓰지만, 회사에서는 [[협력]]업체나 [[외주]]업체라는 말을 더 많이 쓴다.",n:"공급업체 = 협력업체 = 외주업체, 모두 비슷한 말."},
  {s:0,p:"18쪽",t:"할인점은 대형마트를 말하며 영어로 [[디스카운트 스토어(Discount Store)]](이)라고 한다.",n:""},
  {s:0,p:"18쪽",t:"코스트코, 샘스클럽처럼 회원제로 운영되는 창고형 도소매점을 영어로 [[멤버십 웨어하우스 클럽(Membership Warehouse Club)]](이)라고 한다.",n:"한국의 이마트 트레이더스도 비슷한 형태."},
  {s:0,p:"18쪽",t:"특정 상품 분류를 전문적으로 판매하는 할인형 대규모 전문점을 [[Category Killer(카테고리 킬러)]](이)라고 한다.",n:""},
  {s:0,p:"18쪽",t:"Category Killer의 예로 장난감은 [[토이저러스]], 가전제품은 [[베스트바이]], 수리 도구는 [[홈데포]], 의약품은 [[드럭스토어]]이/가 있다.",n:"홈데포가 있는 이유: 미국은 수리 기사를 부르는 비용이 비싸서 직접 고치는 문화."},
  {s:0,p:"18쪽",t:"미국의 베스트바이는 한국으로 치면 [[하이마트(롯데하이마트)]]에 해당하는 가전제품 전문점이다.",n:""},
  {s:0,p:"18쪽",t:"생필품처럼 구매할 때 고민을 덜 하는 상품을 [[저관여]] 상품, 자동차처럼 고민을 많이 하는 상품을 [[고관여]] 상품이라고 한다.",n:""},
  {s:0,p:"18쪽",t:"과자를 사러 갔다가 옆에 있는 디저트까지 함께 사는 것은 [[동반 구매]] 욕구 때문이다.",n:"고관여 상품은 반대로 '동시 비교 욕구'."},

  // 20
  {s:1,set:"1차",p:"20쪽",t:"마이클 포터의 가치사슬 모형에서 보조 활동은 기업 하부 구조, [[인적 자원 관리]], 기술 개발, 조달 활동으로 구성되고, 본원적 활동은 [[내부 물류]], 생산 및 운영, 외부 물류, 마케팅과 판매, [[고객 서비스]]로 구성된다.",n:"21~22쪽은 시험 범위가 아니다."},
  {s:1,p:"20쪽",t:"가치사슬은 [[마이클 포터]]이/가 제시한 개념으로, 크게 [[본원적]] 활동과 [[보조(지원)]] 활동으로 나뉜다.",n:""},
  {s:1,p:"20쪽",t:"원자재 및 생산 투입물을 관리하는 활동은 [[내부 물류]], 완제품을 저장하고 배송하는 활동은 [[외부 물류]]이다.",n:""},
  {s:1,p:"20쪽",t:"보조 활동 중 경영 전략·재무 등을 담당하는 것은 [[기업 하부 구조]], 제품 설계와 기술을 담당하는 것은 [[기술 개발]]이다.",n:""},
  {s:1,p:"20쪽",t:"보조 활동 중 필요한 자원을 매입하는 활동을 [[조달]] 활동이라고 한다.",n:""},
  {s:1,p:"20쪽",t:"공급사슬은 연결된 [[가치사슬]](으)로 구성되어 있다.",n:"가치사슬 = 한 기업 안 / 공급사슬 = 여러 기업의 가치사슬이 맞물린 것."},

  // 23–24
  {s:2,p:"23쪽",t:"기업이 추구할 수 있는 경쟁 우위 4가지는 [[원가]], [[품질]], 유연성, [[시간]]이다.",n:"순서 무관."},
  {s:2,p:"23쪽",t:"유니클로는 [[원가]]에, 자라는 [[시간]]에 초점을 맞춘 가치사슬을 갖추고 있다.",n:"가장 기본 문제."},
  {s:2,p:"23쪽",t:"유니클로라는 이름은 [[유니크 클로징(Unique Clothing)]]에서 나왔고, 모회사의 이름은 [[패스트 리테일링]]이다.",n:""},
  {gone:1,s:2,p:"23쪽",t:"유니클로의 성공 사례는 모든 가치 활동들이 [[재고]]을/를 최소화시키고 상품 소진을 높이는 데 일관성 있는 정책을 실행하고, [[가이젠]](개선)을/를 끊임없이 수행한 결과이다.",n:"교재 표현: \"재고 없는 경영으로 가치 활동들 간의 연계를 통해 가치를 창출한 예\"."},
  {s:2,p:"23–24쪽",t:"유니클로는 [[소품종(한정 품종)]] 대량 생산, 자라는 [[다품종]] 소량 생산을 한다.",n:""},
  {s:2,p:"23–24쪽",t:"유니클로의 리드타임은 [[6~12]]개월, 자라의 리드타임은 [[2~3]]주이다.",n:"교수님이 \"이 차이점을 잘 이해해야 돼\"라고 강조."},
  {s:2,p:"23–24쪽",t:"유니클로는 협력업체를 많이 활용하는 [[아웃소싱]]을/를 하고, 자라는 자회사를 통한 [[수직적 통합]]을/를 한다.",n:"자라는 자회사를 거치니 의사결정이 빨라짐."},
  {s:2,p:"23–24쪽",t:"유니클로는 물류비를 줄이기 위해 [[해상]] 운송을, 자라는 속도를 위해 [[항공]] 운송을 주로 이용한다.",n:""},
  {s:2,p:"23쪽",t:"유니클로는 도레이 등 소재 업체와 [[장기]] 계약을 맺어 고품질 원단을 저원가로 조달한다.",n:"물량을 보장해 주는 대신 단가를 낮춤."},
  {s:2,p:"23쪽",t:"유니클로의 R&D는 패션보다 소재의 [[기능성]] 개선에 집중한다. (예: 히트텍, 에어리즘)",n:"한 번 개발하면 6~12개월 꾸준히 생산."},
  {s:2,p:"24쪽",t:"자라는 일주일에 [[두(2)]]번씩 신상품을 입고한다.",n:""},
  {s:2,p:"24쪽",t:"자라는 안 팔리는 상품은 빨리 [[철수]]시키고, 유니클로처럼 [[완판]]을/를 목표로 하지 않는다.",n:"둘 다 '재고 최소화'지만 방식이 완전히 다름."},
  {s:2,p:"23–24쪽",t:"유니클로와 자라의 공통점은 기획·생산·유통·판매를 단일 기업이 통합 관리하는 [[SPA]] 모델, 창고에 쌓아두지 않고 바로 출고하는 [[크로스 도킹]] 시스템, 실시간 데이터 기반 재고 관리이다.",n:"교재가 아니라 수업 발표 내용이라 출제 가능성은 낮은 편."},

  // 24–25
  {s:3,set:"1차",p:"25쪽",t:"HP는 [[전원 공급 장치]] 조립과 [[매뉴얼]]의 포장을 출고 전 공장이 아닌 판매 지역의 유통업체에서 수행하도록 프로세스를 바꾸었다. 베네통은 염색 후 편직하던 방식을 [[편직]]을/를 먼저 하고 [[염색]]을/를 나중에 하는 방식으로 바꾸었다.",n:"HP는 이를 위해 제품을 모듈화했다. 두 사례 모두 수요 예측과 자재 수급 정확성을 높인 효과가 났다."},
  {s:3,p:"24쪽",t:"대량 생산은 원가에 초점을 맞춘 [[계획]] 생산 시스템이고, 맞춤 생산은 고객 니즈에 맞춘 [[주문식]] 생산 시스템이다.",n:""},
  {s:3,p:"24쪽",t:"대량 생산과 맞춤 생산은 원래 반대 개념이지만, 둘을 결합한 것을 영어로 [[매스 커스터마이제이션(Mass Customization)]](이)라고 한다.",n:"우리말로 대량 (고객) 맞춤 생산."},
  {s:3,p:"24쪽",t:"유튜브는 고객이 초기에 선호하는 몇 개 동영상을 보면 그 고객의 [[취향]]에 맞는 맞춤 동영상을 제안한다.",n:""},
  {s:3,p:"24쪽",t:"BMW 미니 쿠페는 고객이 인터넷으로 차의 [[지붕]]에 원하는 그래픽이나 사진을 넣을 수 있게 하고, 자동차 [[부품]]도 직접 선택할 수 있게 했다.",n:"비싸지 않게 나만의 차를 만드는 것이 포인트."},
  {s:3,p:"24쪽",t:"캐나다 [[몬트리올]]의 정보기술 업체인 마이 버추얼 모델은 고객이 자신과 비슷한 가상 모델인 [[아바타]]을/를 만들 수 있게 했다.",n:"리바이스가 이 아바타를 활용함."},
  {s:3,p:"24쪽",t:"마이 버추얼 모델 서비스 실시 후 구매자들의 평균 주문량은 [[15]]% 높아졌고, 방문객 중 구매 비율은 [[45]]% 늘었다.",n:"가입자는 1천만 명 이상."},
  {s:3,p:"25쪽",t:"지연 전략은 영어로 [[포스트포먼트 스트래터지(Postponement Strategy)]](이)라고 하며, 매스 커스터마이제이션이 '제품'에 관한 것이라면 지연 전략은 [[프로세스(공정)]]을/를 재설계한 것이다.",n:""},
  {s:3,p:"25쪽",t:"지연 전략은 최종적인 차별화나 [[맞춤화]] 과정을 가능한 한 늦추는 전략이다.",n:"완성 시점을 최대한 고객 쪽으로 미룸."},
  {s:3,p:"25쪽",t:"HP는 지연 전략을 위해 제품 설계를 바꿔 [[공용]] 부품은 먼저 조립하고, 나라별로 다른 [[독립적인]] 부품은 나중에 조립할 수 있도록 [[모듈]]화시켰다.",n:"전원 공급 장치가 대표적인 독립 부품."},
  {s:3,p:"25쪽",t:"HP는 지연 전략을 통해 재고 비용을 [[18]]%, 총비용을 [[25]]% 절감했다.",n:"당시 프린터 시장 점유율 세계 1위."},
  {s:3,p:"25쪽",t:"베네통은 후염가공 공정을 도입하여 [[진부화]]된 재고품을 폐기하는 데 소요되는 수백만 달러를 절약할 수 있었다.",n:"염색→편직 순서를 편직→염색으로 바꿈."},

  // 33–34
  {gone:1,s:4,set:"1차",p:"33쪽",t:"통합 물류적 관점에서 SCM의 기능은 [[수요 예측]] 기능, 수요 예측에 기초해 생산·재고·물류 계획을 수립하는 기능, 계획에 입각해 제조 일정과 자재 및 부품의 [[보충]]을/를 담당하는 기능, [[납기 회답]] 기능의 4가지이다.",n:"10/14 수업에서 4가지 기능을 순서대로 다시 짚으셨다."},
  {s:4,set:"1차",p:"34쪽",t:"기업 간의 상호작용 및 구성원 간의 연계적 관점의 예로, 풀무원과 롯데마트가 지속적 재고 보충인 [[CRP]]을/를 추진하면서 겪은 갈등과 극복 과정을 들 수 있다.",n:"기법의 개념보다 추진 과정의 갈등과 극복이 중요하다는 관점."},
  {s:4,p:"33–34쪽",t:"SCM을 바라보는 3가지 관점은 통합 물류적 관점, 기업 간의 상호작용 및 구성원 간의 [[연계적]] 관점, 공급사슬 내의 [[정보 공유]] 관점이다.",n:""},
  {s:4,p:"33쪽",t:"통합 물류적 관점의 납기 회답 기능은 [[재고]]만을 기초로 한 단순한 회답이 아니라, 들어올 제품의 납입 시간과 [[생산]] 일정까지 고려한 회답이다.",n:"수주부터 출하까지 걸리는 시간을 줄여 고객 서비스를 만족시킴."},

  // 62–64
  {s:5,set:"1차",p:"63쪽",t:"배치 주문 방식으로 인한 채찍 효과를 해결하려면 도소매업체들의 [[주문 시점]]을/를 골고루 분배하고, 평준화된 수량으로 주문받으면서 [[배치 주문]] 간격을 줄여야 한다.",n:"P&G는 한 품목이 아니라 여러 품목이 모여 한 트럭이 되면 10% 할인해주는 방식으로 바꿨다."},
  {gone:1,s:5,set:"1차",p:"63–64쪽",t:"할당 게임으로 인한 채찍 효과를 방지하려면 [[반품 제약]]을/를 엄격하게 하여 가수요 감소를 유도하거나, 제품 할당 시 대리점의 [[과거 주문 실적]]에 의해 수요량을 결정하는 방법이 있다. 또한 [[조기 주문 예약]]을/를 정착시키거나 시장의 [[가격 기능]]을/를 조절하는 방법도 생각해볼 수 있다.",n:"마지막 방법은 쉽게 말해 가격을 올려 수요를 줄이는 것."},
  {s:5,p:"60–62쪽",t:"채찍 효과를 처음 생각한 기업은 [[P&G]](이)고, 아기 수는 일정한데 [[아기 기저귀]]의 주문량이 들쑥날쑥한 이유를 고민하다 발견했다.",n:""},
  {s:5,p:"62쪽",t:"각 단계는 정보가 제대로 공유되지 않고 물류가 지연되는 상황에 대비해 유사시를 위한 [[안전]] 재고를 보유하게 되고, 이것이 채찍 효과를 키운다.",n:"Safety Stock. 상류로 갈수록 불확실성이 커짐."},
  {s:5,p:"62쪽",t:"채찍 효과의 원인 중 수요예측 과정에서는 각 단계마다 수요 증가나 감소가 2중, 3중으로 일어나 최종 소비자의 실제 수요가 [[왜곡]]된다.",n:"중복 과장 / 중복 과소 수요 예측."},
  {s:5,p:"63쪽",t:"P&G는 원래 한 품목으로 배송 트럭을 꽉 채우면 [[10]]% 할인해 주었으나, 이후 여러 [[품목]]이/가 모여 한 트럭이 되면 할인해 주는 방식으로 바꾸었다.",n:"배달 빈도는 같고 배달 비용도 늘지 않으면서 배치 주문 문제 해결."},
  {s:5,p:"63쪽",t:"지금 필요하지 않은데 할인 기간에 미리 사두는 것을 [[전방 구매(Forward Buying)]], 싸게 산 것을 마진을 붙여 다른 업체에 되파는 것을 [[전매(Diverting)]](이)라고 한다.",n:""},
  {s:5,p:"63–64쪽",t:"할당 게임에서 공장은 5,000대밖에 못 만드는데 10,000대 주문이 오면 대리점별로 물건을 할당할 수밖에 없고, 이로 인해 실수요보다 큰 [[가수요]]이/가 발생한다. 이런 현상은 특히 [[신제품]]의 경우에 자주 발생한다.",n:"가수요는 공급사슬의 상류로 갈수록 더 커짐."},

  // 68–70
  {gone:1,s:6,set:"1차",p:"69쪽",t:"크라이슬러의 합리화 1단계는 [[중복]]되는 공급업체를 파악하고 없애는 것이었고, 2단계는 [[중요도]]에 기반하여 공급업체들을 분류하는 것이었다. 그 결과 공급업체들이 신제품 개발 프로세스에 통합되어 신제품 출시 기간이 [[24]]개월로 단축되었다.",n:"1단계에서는 스펙(성과 사양)과 부품을 표준화해 최상의 공급업체 한두 곳을 선정했다."},
  {gone:1,s:6,set:"1차",p:"70쪽",t:"복잡성은 혼란을 야기시키고 원가를 증가시켜 경쟁력을 약화시킬 수 있지만, 때로는 복잡성을 더하는 것이 필수 불가결하다. 따라서 복잡성으로 인해 야기된 [[추가 비용]]이/가 추가된 [[가치]]을/를 초과하지 않도록 하는 것이 중요하다.",n:"70쪽 맨 마지막 문장. 교수님이 수업에서 두 번 반복하셨다. 가치는 매출이나 수익 증대를 뜻한다."},
  {s:6,p:"69쪽",t:"크라이슬러의 1단계 합리화는 기술적으로 다른 부품들의 [[성과 사양(스펙)]]을/를 표준화해서 한두 군데의 최상의 공급업체를 선정하고, 그 결과 재고 보유 품목 수, 즉 [[SKU]]을/를 줄였다.",n:"구매를 합쳐 더 저렴한 원가로 구매."},
  {s:6,p:"69쪽",t:"크라이슬러의 2단계 합리화에서 공급업체는 일반 공급업체, [[협력]] 업체, [[전략적 제휴]] 업체로 분류되었다.",n:"순서 무관. 나사·볼트·오일 = 일반 공급업체 / 엔진·배터리 = 전략적 제휴."},
  {s:6,p:"70쪽",t:"크라이슬러는 가장 인기 있고 수익이 나던 [[지프 그랜드 체로키]]의 V8 엔진 공급업체를 조사했다.",n:""},
  {s:6,p:"70쪽",t:"V8 엔진의 구성 부품인 [[롤러 리프트 밸브]]은/는 1차 공급업체인 [[이튼 코퍼레이션]]이/가 납품하고 있었다.",n:""},
  {s:6,p:"70쪽",t:"이튼 코퍼레이션은 2차 공급업체에서 받은 [[강판 주물]]을/를 이용해 밸브를 정밀 가공했고, 2차 공급업체는 이 주물을 만들기 위해 화학적 합성물인 [[클레이]]이/가 필요했다.",n:""},
  {s:6,p:"70쪽",t:"3차 클레이 제조업체는 수익성 없는 주물 클레이 사업에서 손을 떼고 [[쓰레기통]] 사업에 집중하기로 결정했다.",n:"3차 업체 하나 때문에 밸브 생산 전체가 멈출 뻔함."},
  {s:6,p:"70쪽",t:"[[복잡성]]은/는 혼란을 야기시키고 원가를 증가시키며 비생산적인 의사결정을 하게 만들어 경쟁력을 약화시킬 수 있다. 그러나 때로는 이를 더하는 것이 [[필수 불가결]]하다.",n:"마지막 문장: 복잡성으로 인한 추가 비용이 추가된 가치를 초과하지 않도록."},

  // 교수님 문제 유형 (수업 슬라이드)
  {s:7,set:"교수님 유형 1",p:"15–18쪽",t:"공급사슬 참여자로는 생산자, [[유통업자]], 소매상, 고객, 서비스 제공자가 있다. 소매상의 유형 중에 생필품을 저렴하게 판매하는 대형마트 할인점이나 회원제 창고형 도소매점과는 달리 한정된 품목에서 다양한 모델을 갖춘 대형 할인전문점인 카테고리 킬러로는 토이저러스, [[베스트바이]], [[홈데포]] 등이 있다.",n:"카테고리 킬러 마지막 칸은 드럭스토어를 써도 된다. 토이저러스=장난감, 베스트바이=가전, 홈데포=수리 도구, 드럭스토어=의약품."},
  {s:7,set:"교수님 유형 1",p:"33쪽",t:"물류적 관점에 입각한 SCM의 네 가지 기본 구성 요건은 첫째 판매동향을 기초로 한 수요예측 기능, 둘째 수요예측에 기초한 기업수준의 생산과 재고, 물류계획을 수립하는 기능, 셋째 각 공장의 생산라인 수준에 의한 제조일정과 자재 및 부품의 [[보충(Replenishment)]]을 위한 기능, 현재 보유재고 뿐만 아니라 부품 조달시간과 생산일정계획을 모두 고려한 [[납기 회답]] 기능이다.",n:"순서 암기: 수생보납 (수요예측 → 생산·재고·물류계획 → 보충 → 납기 회답)."},
  {s:7,set:"교수님 유형 2",p:"24–25쪽",t:"가치사슬을 향상시켜 가치를 창출한 또 다른 예로는 특이하게 원가와 유연성을 동시에 향상시키는 경쟁우위를 달성하기 위해 [[대량 맞춤 생산(Mass Customization)]]이 가능한 사례로 [[BMW 미니 쿠페]], [[유튜브]], 마이버추얼모델 등이 있다. 이러한 경우에는 기업의 유연한 프로세스를 이용하여 고객 맞춤화된 제품 및 서비스를 대량으로 저렴한 원가에 생산하는 방법을 추구하게 된다. 이와 연관이 높은 [[지연 전략]]은 제품뿐만 아니라 프로세스도 재설계함으로써 가능한 최종 순간에 맞춤생산이 이루어질 수 있도록 프로세스를 배열하여야 한다는 것으로 HP와 [[베네통]] 사례가 있다. HP는 프린터 시장에서 이렇게 완성시점을 연기함으로써 조립단계까지의 [[수요 예측과 자재 수급]]의 정확성을 높이고 최종수요와 주문이 확정된 후에 [[전원 공급 장치 조립]]와 [[매뉴얼의 포장]]을 포장하여 공장에서 생산하는 단계에서의 재고를 최소화할 수 있었다.",n:"BMW 미니 쿠페·유튜브는 순서 무관. 마이버추얼모델을 활용한 기업은 리바이스."},
  {s:7,set:"교수님 유형 3",p:"23–24쪽",t:"유니클로의 성공사례는 모든 가치활동들이 재고를 최소화시키고 상품소진율을 99.5%를 이루는데 일관성 있는 정책을 실행하고 [[가이젠(개선)]]을 끊임없이 수행한 가치창출의 결과이다. 즉, 패스트리테일링(Fast Retailing)이란 이름에서부터 회사정책을 철저히 [[저가 상품]]을 판매하는데 초점을 맞추고, 무재고(Zero Inventory) 등 가격을 낮출 수 있는 모든 의사결정을 하는 것이다. 심지어 신제품 출시 속도를 늦추더라도 3개월 이상 제품을 진열대에 놓고 판매하는 의사결정을 한다. 반면에 [[자라(ZARA)]]는 다양한 제품을 소량 생산하여 제품의 희소가치와 고객의 구매욕구를 향상시키며, 지역별 선호의류를 바코드를 통해 빠르게 파악하고, 1주일에 2번 유행에 민감한 제품을 납품할 정도로 제품개발시간이 빠르며 시간 위주의 경쟁우선순위를 보유하고 있다.",n:"숫자도 같이 외우기: 상품소진율 99.5%, 3개월 이상 진열, 1주일에 2번 납품."},
  {s:7,set:"교수님 유형 4",p:"62–64쪽",t:"채찍효과의 원인은 첫째는 [[수요 예측]] 과정에서 발생하는 경우다. 최종 고객과 생산의 사이에 있는 각 단계에서 수요증가나 감소가 이중 삼중으로 계속 일어나 최종소비자의 실제 수요가 왜곡되는 것이다. 채찍효과의 두 번째 원인은 [[배치]] 주문 방식이다. 물건이 하나가 팔리면 그 때 주문되는 것이 아니라 100개가 팔릴 때까지 기다렸다 한꺼번에 주문을 하는 것이다. 작은 것을 여러 번 배달하는 것보다는 한 번에 많은 양을 배송함으로써 비용이 절감되기 때문에 이러한 방식을 선호한다. 평준화된 수량으로 주문 간격을 줄이기 위해 [[P&G]] 회사는 배송 트럭 안에 들어가는 품목들이 다양하게 되도록 유도함으로써 채찍효과를 없애고, 배달비용이 증가하는 것을 없앴다. 채찍효과 발생의 세 번째 원인은 생산업체의 [[가격]] 정책과 유통업체의 [[전방 구매]]에 있다. 생산업체는 도소매업체에게 종종 일정기간 할인을 해주는데 이때 도소매업체들은 한꺼번에 많은 물량을 구입해서 재고로 쌓아 놓고 몇 달 동안 주문을 하지 않곤 한다. 물론 재고로 쌓아두는 대신 싸게 산 상품을 바로 팔아 차익을 챙기기도 한다. 이를 해결하기 위해서는 [[상시 저가 판매]] 정책을 적절히 사용하거나 제품은 할인해 주되 배달은 몇 주나 몇 달 간격으로 나누어 도소매업체에게 공급하는 방법을 쓸 수 있다. 네 번째 원인은 [[할당 게임]]에서 찾을 수 있다. 특정 대리점에서는 10개가 필요한데 5개 밖에 받지 못하기 때문에 다음에 비슷한 상황이 발생하면 실수요가 10개인데도 20개를 주문하게 된다. 모든 대리점에 그렇게 하기 때문에 실수요는 10,000대인데 가수요로 20,000대가 들어오는 것이다. 이러한 현상을 방지하기 위해서는 [[반품]] 제약을 엄격히 하여 가수요 감소를 유도하거나, 제품 배분 시 대리점의 과거 주문 실적에 의해 수요량을 결정하는 방법이 있다. 또한 [[조기 주문 예약]]을 정착시키거나 시장의 가격기능으로 조절하는 해법도 생각해 볼 수 있다.",n:"⑥ 상시 저가 판매는 따로 알려주신 답에 없던 칸이라 수업 내용(상시 저가 판매 정책, EDLP)을 넣었어요. 교재 63쪽 표현을 한 번 확인하세요."},
  {s:7,set:"교수님 유형 5",p:"델·컴프 USA 사례",t:"[[델(DELL)]]는 공급사슬을 둘러싸고 일어나는 다양한 변화를 신속하게 포착하여, 고객과 직접 접촉하는 공급사슬 모델을 구축하였다. 미국 최대의 PC 양판점인 [[컴프 USA]]는 이것에 대항하여 유통업의 틀을 과감히 깨고 '컴프 USA' 브랜드의 PC를 대대적으로 판매하기 시작. 대리점과 인터넷 양쪽에서 주문을 받아서 수주 생산으로 PC를 제공한다. 소매를 기점으로 한 공급사슬 모델의 구축에 필사적으로 도전.",n:"델 = 고객과 직접 접촉하는 직판 모델. 컴프 USA = 소매(양판점)를 기점으로 한 공급사슬 모델로 맞섬. 정리했던 시험 범위 페이지 밖의 사례라 교재에서 위치를 확인하세요."},
  {s:7,set:"교수님 유형 5",p:"닌텐도 사례",t:"[[닌텐도]]는 게임 소프트웨어의 라이프 사이클에 대응하지 못하고 예전의 공급사슬을 유지하다가 소비자는 히트 상품에 급격히 반응하며 몰려들었다가, 눈 깜짝 할 사이에 싫증내 버려서 발생하는 (채찍효과)에 의해 소니사 등에 비해 비효율적인 원가구조를 갖게 되었다.",n:"슬라이드에 이미 '채찍효과'가 적혀 있으니 빈칸은 닌텐도 하나. 비교 대상은 소니. 이 사례도 정리했던 시험 범위 페이지 밖이에요."},
  {s:7,set:"교수님 유형 5",p:"69–70쪽",t:"[[크라이슬러]]의 2단계 합리화 프로그램의 첫 번째 단계는 [[중복]]되는 공급업체를 파악하고 없애는 것이었다. 그러기 위하여 부품을 표준화하고 한두군데의 최상의 공급업체를 선정하고 구매를 합침으로써 저렴한 원가로 구매할 수 있었다. 두 번째 단계는 [[중요도]]에 기반하여 공급업체를 분류하고 공급업체들과의 관계를 정립하는 것이었다. 때로는 복잡성을 더하는 것이 필수불가결하다. 그러나 중요한 것은 복잡성으로 인하여 야기된 추가비용이 추가된 [[가치]]를 초과하지 않도록 하는 것이다.",n:"2단계 결과 신제품 출시 기간이 24개월로 단축됨. 마지막 문장은 70쪽 맨 마지막 문장."}
];
Q.forEach((q, i) => { q.id = i + 1; });
const QS = Q.filter(q => !q.gone);
const BY_ID = {};
QS.forEach(q => { BY_ID[q.id] = q; });
const ORDER_IDS = SECTIONS.flatMap(sec => QS.filter(q => q.s === sec.id).map(q => q.id));
ORDER_IDS.forEach((id, i) => { BY_ID[id].no = i + 1; });

const CIRCLED = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫";
const STORE_KEY = "scm-quiz-stars";
let stars = new Set();
try { stars = new Set(JSON.parse(localStorage.getItem(STORE_KEY) || "[]")); } catch (e) {}
function saveStars() { try { localStorage.setItem(STORE_KEY, JSON.stringify([...stars])); } catch (e) {} }

const state = { section: -1, showAll: false, onlyStar: false, shuffled: false, order: ORDER_IDS.slice() };

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

function renderText(q) {
  let k = 0;
  return esc(q.t).replace(/\[\[(.+?)\]\]/g, (_, ans) => {
    const mark = CIRCLED[k++];
    return `<button type="button" class="blank${state.showAll ? " open" : ""}" data-ans="${ans}" data-mark="${mark}" aria-label="빈칸 ${mark}, 눌러서 정답 보기">${state.showAll ? ans : mark}</button>`;
  });
}

function answersLine(q) {
  const list = [...q.t.matchAll(/\[\[(.+?)\]\]/g)].map((m, i) => `${CIRCLED[i]} ${esc(m[1])}`);
  return list.join(" · ");
}

function card(q) {
  const el = document.createElement("article");
  el.className = "card" + (stars.has(q.id) ? " starred" : "") + (state.showAll ? " done" : "");
  el.dataset.id = q.id;
  el.innerHTML = `
    <div class="top">
      <span class="qid">Q-${String(q.no).padStart(3, "0")}</span>
      ${q.set ? `<span class="tag${q.s === 7 ? " prof" : ""}">${q.set === "1차" ? "1차 연습" : esc(q.set)}</span>` : ""}
      <button type="button" class="star" aria-pressed="${stars.has(q.id)}">${stars.has(q.id) ? "★ 헷갈림" : "☆ 헷갈림"}</button>
    </div>
    <p class="q">${renderText(q)}</p>
    <div class="foot"><button type="button" class="btn reveal">${state.showAll ? "정답 숨기기" : "정답·해설"}</button></div>
    <p class="note"><b>${esc(q.p)}</b>${answersLine(q)}${q.n ? "<br>" + esc(q.n) : ""}</p>`;
  return el;
}

function visible() {
  return state.order.map(id => BY_ID[id]).filter(q =>
    (state.section < 0 || q.s === state.section) && (!state.onlyStar || stars.has(q.id)));
}

function render() {
  const out = document.getElementById("out");
  out.innerHTML = "";
  const qs = visible();
  document.getElementById("count").textContent = `${qs.length}문제`;
  if (!qs.length) {
    out.innerHTML = `<p class="empty">${state.onlyStar ? "아직 ☆ 표시한 문제가 없어요. 헷갈리는 문제에서 ☆ 헷갈림을 눌러 모아두세요." : "문제가 없어요."}</p>`;
    return;
  }
  if (state.shuffled) {
    const list = document.createElement("div"); list.className = "list";
    qs.forEach(q => list.appendChild(card(q)));
    out.appendChild(list);
    return;
  }
  SECTIONS.forEach(sec => {
    const group = qs.filter(q => q.s === sec.id);
    if (!group.length) return;
    const head = document.createElement("div");
    head.className = "section-head";
    head.innerHTML = `<h2>${esc(sec.name)}</h2><span class="pg">${sec.pg} · ${group.length}문제</span>`;
    out.appendChild(head);
    const list = document.createElement("div"); list.className = "list";
    group.forEach(q => list.appendChild(card(q)));
    out.appendChild(list);
  });
}

function renderChips() {
  const box = document.getElementById("chips");
  const all = [{ label: "전체", idx: -1, n: QS.length }].concat(
    SECTIONS.map(s => ({ label: s.chip || s.pg, idx: s.id, n: QS.filter(q => q.s === s.id).length, title: s.name })));
  box.innerHTML = all.map(c =>
    `<button type="button" class="chip" data-idx="${c.idx}" aria-pressed="${state.section === c.idx}" ${c.title ? `title="${esc(c.title)}"` : ""}>${esc(c.label)}<span class="n">${c.n}</span></button>`).join("");
}

document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  state.section = Number(b.dataset.idx);
  renderChips(); render();
});

document.getElementById("allBtn").addEventListener("click", e => {
  state.showAll = !state.showAll;
  e.currentTarget.setAttribute("aria-pressed", state.showAll);
  e.currentTarget.textContent = state.showAll ? "정답 전체 숨기기" : "정답 전체 보기";
  render();
});

document.getElementById("starBtn").addEventListener("click", e => {
  state.onlyStar = !state.onlyStar;
  e.currentTarget.setAttribute("aria-pressed", state.onlyStar);
  render();
});

document.getElementById("shuffleBtn").addEventListener("click", e => {
  state.shuffled = !state.shuffled;
  if (state.shuffled) {
    const a = ORDER_IDS.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    state.order = a;
  } else {
    state.order = ORDER_IDS.slice();
  }
  e.currentTarget.setAttribute("aria-pressed", state.shuffled);
  e.currentTarget.textContent = state.shuffled ? "단원 순서로" : "순서 섞기";
  render();
});

document.getElementById("out").addEventListener("click", e => {
  const blank = e.target.closest(".blank");
  if (blank) {
    const open = blank.classList.toggle("open");
    blank.textContent = open ? blank.dataset.ans : blank.dataset.mark;
    return;
  }
  const cardEl = e.target.closest(".card"); if (!cardEl) return;
  const id = Number(cardEl.dataset.id);
  if (e.target.closest(".reveal")) {
    const done = cardEl.classList.toggle("done");
    cardEl.querySelectorAll(".blank").forEach(b => {
      b.classList.toggle("open", done);
      b.textContent = done ? b.dataset.ans : b.dataset.mark;
    });
    e.target.closest(".reveal").textContent = done ? "정답 숨기기" : "정답·해설";
    return;
  }
  const star = e.target.closest(".star");
  if (star) {
    if (stars.has(id)) stars.delete(id); else stars.add(id);
    saveStars();
    const on = stars.has(id);
    star.setAttribute("aria-pressed", on);
    star.textContent = on ? "★ 헷갈림" : "☆ 헷갈림";
    cardEl.classList.toggle("starred", on);
    if (state.onlyStar && !on) render();
  }
});

renderChips();
render();
</script>


</body></html>
